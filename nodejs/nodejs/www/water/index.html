<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปริมาณน้ำ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.css" />
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container-fluid mt-2 mb-4">
        <div class="row">
            <div class="col-9 col-sm-6 order-md-1 order-first">
                <span class="text-title">ปริมาณน้ำ</span><br>
                <span class="text-subtitle text-muted">บันทึกข้อมูล ปริมาณน้ำฝน น้ำท่า</span>
            </div>

            <div class="col-3 col-sm-6 order-md-2 order-last text-center">
                <nav aria-label="breadcrumb" class="breadcrumb-header float-end float-lg-end">
                    <span id="logout" style="display:none;">
                        <table style="width:auto;">
                            <tr>
                                <p></p>
                                <td class="block"><img alt="" id="pictureUrl"></td>
                            </tr>
                        </table>
                    </span>
                    <span id="login">
                        <a id="buttonDiv" data-onsuccess="onSignIn"></a>
                    </span>
                </nav>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="col-12 mb-4">
            <div>
                <label for="">กรอกพิกัดของท่านหรือแตะลงบนแผนที่เพื่อปักหมุด</label>
            </div>
        </div>

        <div class="card mt-1" id="map"></div>

        <form id="waterForm" enctype="multipart/form-data">
            <div class="">
                <input type="hidden" name="userid" id="userid">
                <div class="form-group">
                    <label for="">ละติจูด</label>
                    <input type="text" class="form-control" step="0.1" id="lat" name="lat" placeholder="ละติจูด"
                        onkeyup="updateMarker()" required>
                </div>
                <div class="form-group">
                    <label for="">ลองจิจูด</label>
                    <input type="text" class="form-control" step="0.1" id="lng" name="lng" placeholder="ลองจิจูด"
                        onkeyup="updateMarker()" required>
                </div>
                <div class="form-group"><label>ชื่อสถานที่: </label>
                    <div class="form-group">
                        <input type="text" name="stationname" id="stationname" class="form-control" required>
                    </div>
                </div>
                <div class="form-group"><label>ประเภทข้อมูล: </label>
                    <div class="form-group">
                        <select name="watertype" id="watertype" class="form-select">
                            <option value="ปริมาณน้ำฝน">ปริมาณน้ำฝน</option>
                            <option value="ปริมาณน้ำท่า">ปริมาณน้ำท่า</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label id="waterlabel"></label>
                    <div class="form-group">
                        <input type="number" step="0.1" name="waterlevel" id="waterlevel" class="form-control"
                            required />
                    </div>
                </div>
                <div class="form-group" id="waterflow-group">
                    <label>การไหล (เซนติเมตร/วินาที): </label>
                    <div class="form-group">
                        <input type="number" step="0.1" name="waterflow" id="waterflow" class="form-control" />
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">ยกเลิก</button>
                <button type="submit" class="btn btn-primary">บันทึก</button>
            </div>
        </form>
    </div>

    <div class="modal fade text-left" id="inputModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel33">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
            <div class="modal-content">

            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto"></strong>

                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                บันทึกข้อมูลสำเร็จ
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <hr>
        <footer>
            <div class="footer clearfix mb-0 text-muted">
                <div class="float-start">
                    <!-- <p>2024 ©</p> -->
                </div>
                <div class="float-end">
                    <p>พัฒนาด้วย <span class="text-danger"><i class="bi bi-heart-fill icon-mid"></i></span>
                        <a href="https://engrids.soc.cmu.ac.th/">EnGRIDs</a>
                    </p>
                </div>
            </div>
        </footer>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.js"
    charset="utf-8"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<script src="./app.js"></script>

</html>
